name: RepoWiki Technical Documentation

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'supabase/**'
      - '*.sql'
      - 'package.json'
      - 'pnpm-workspace.yaml'
      - '.repowikiignore'
      - '.github/workflows/repowiki.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: repowiki-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install RepoWiki
        run: pip install repowiki

      - name: Generate technical wiki
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          repowiki scan . --format html --full -o docs/technical-wiki/generated
          mv docs/technical-wiki/generated/repowiki.html docs/technical-wiki/generated/index.html
          touch docs/technical-wiki/generated/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs/technical-wiki/generated

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4